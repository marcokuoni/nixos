name: CI

# Static checks only. The full system can't be built or flake-checked here:
# the go2hs input is a local path on the laptop.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Use the tools from the nixpkgs revision in flake.lock, so CI formats
      # and lints exactly like the laptop does.
      - name: Pin tools to flake.lock
        run: echo "NIXPKGS=github:NixOS/nixpkgs/$(jq -r .nodes.nixpkgs.locked.rev flake.lock)" >> "$GITHUB_ENV"

      - name: Check formatting (nixfmt)
        run: nix run "$NIXPKGS#nixfmt" -- --check .

      - name: Lint (statix)
        run: nix run "$NIXPKGS#statix" -- check .

      - name: Dead code (deadnix)
        run: nix run "$NIXPKGS#deadnix" -- --fail .

      - name: Flake lock health (flake-checker)
        run: nix run "github:DeterminateSystems/flake-checker"
