name: CI

# Static checks only. The system itself can't be built or flake-checked
# here: the go2hs input is a local path on the laptop.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Format & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Same tool versions as `nix fmt` / `nix develop` on the laptop: the
      # nixpkgs revision the system uses (root input "nixpkgs" in flake.lock).
      - name: Pin tools to flake.lock
        run: echo "NIXPKGS=github:NixOS/nixpkgs/$(jq -r '.nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)" >> "$GITHUB_ENV"

      # nixfmt-tree = treefmt + nixfmt over the files git tracks;
      # --ci fails if any file would change
      - name: Check formatting (nixfmt-tree)
        run: nix run "$NIXPKGS#nixfmt-tree" -- --ci

      - name: Lint (statix)
        run: nix run "$NIXPKGS#statix" -- check .

      - name: Dead code (deadnix)
        run: nix run "$NIXPKGS#deadnix" -- --fail .

      - name: Flake lock health (flake-checker)
        run: nix run "github:DeterminateSystems/flake-checker"
